<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a2d36"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1">
      <stop offset="0" stop-color="#0b0c10" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0b0c10" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace}
    .sans{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
    .edge{stroke:#2f3340;stroke-width:1.2}
    .node{fill:#0b0c10;stroke:#4a5060;stroke-width:1.5}
    .hot{fill:#0b0c10;stroke:#ff2e97;stroke-width:2}
    .pulse{fill:#ff2e97}
    .ring{fill:none;stroke:#ff2e97;animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
    .cur{animation:bl 1.1s infinite steps(1)}
    @keyframes bl{50%{opacity:0}}
    .in{animation:in .6s backwards}
    @keyframes in{from{opacity:0}}
  </style>

  <rect width="1200" height="300" fill="#0b0c10"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- network graph -->
  <g>
    <path id="e1" class="edge" d="M720 80 L840 140"/>
    <path id="e2" class="edge" d="M840 140 L980 90"/>
    <path id="e3" class="edge" d="M840 140 L900 230"/>
    <path id="e4" class="edge" d="M980 90 L1090 160"/>
    <path id="e5" class="edge" d="M900 230 L1090 160"/>
    <path id="e6" class="edge" d="M760 220 L900 230"/>
    <path id="e7" class="edge" d="M720 80 L760 220"/>
    <path id="e8" class="edge" d="M980 90 L1040 40"/>
    <path id="e9" class="edge" d="M1090 160 L1150 250"/>
    <path id="e10" class="edge" d="M900 230 L1000 280"/>

    <circle r="3" class="pulse"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3" class="pulse"><animateMotion dur="2.6s" begin="0.7s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3" class="pulse"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="3" class="pulse"><animateMotion dur="3s" begin="0.3s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
    <circle r="3" class="pulse"><animateMotion dur="2.8s" begin="1.6s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>

    <rect x="711" y="71" width="18" height="18" rx="3" class="node"/>
    <rect x="751" y="211" width="18" height="18" rx="3" class="node"/>
    <rect x="1031" y="31" width="18" height="18" rx="3" class="node"/>
    <rect x="1141" y="241" width="18" height="18" rx="3" class="node"/>
    <rect x="991" y="271" width="18" height="18" rx="3" class="node"/>
    <rect x="971" y="81" width="18" height="18" rx="3" class="node"/>
    <rect x="891" y="221" width="18" height="18" rx="3" class="node"/>
    <rect x="1081" y="151" width="18" height="18" rx="3" class="node"/>
    <rect x="829" y="129" width="22" height="22" rx="4" class="hot"/>
    <rect x="829" y="129" width="22" height="22" rx="4" class="ring"/>
  </g>
  <rect width="1200" height="300" fill="url(#fadeR)"/>

  <!-- text -->
  <text x="64" y="70" class="mono" font-size="15" fill="#6b7280">~/mestupinanm <tspan fill="#ff2e97">main</tspan> <tspan fill="#4b5563">●</tspan></text>
  <text x="64" y="152" class="sans in" font-size="52" font-weight="700" fill="#f3f4f6" letter-spacing="-1">María Paula Estupiñán</text>
  <text x="64" y="194" class="mono in" style="animation-delay:.3s" font-size="18" fill="#9ca3af">Software Developer <tspan fill="#ff2e97">/</tspan> Web3 <tspan fill="#ff2e97">/</tspan> Developer Relations</text>
  <text x="64" y="244" class="mono in" style="animation-delay:.6s" font-size="15" fill="#6b7280"><tspan fill="#ff2e97">$</tspan> building tools for developers<tspan class="cur" fill="#ff2e97"> ▍</tspan></text>
  <rect x="64" y="86" width="40" height="3" fill="#ff2e97"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1000 400" width="1000" height="400">
  <style>
    text{white-space:pre}
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;font-size:15px}
    .k{fill:#ff2e97}
    .v{fill:#d1d5db}
    .d{fill:#6b7280}
    .ln{animation:in .2s backwards}
    @keyframes in{from{opacity:0}}
    .cur{animation:bl 1s infinite steps(1)}
    @keyframes bl{50%{opacity:0}}
  </style>
  <rect x="0.5" y="0.5" width="999" height="399" rx="10" fill="#0b0c10" stroke="#2a2d36"/>
  <path d="M0.5 10.5 a10 10 0 0 1 10 -10 H989.5 a10 10 0 0 1 10 10 V36 H0.5 Z" fill="#14161c"/>
  <line x1="0.5" y1="36" x2="999.5" y2="36" stroke="#2a2d36"/>
  <circle cx="22" cy="18" r="5" fill="#3a3d47"/><circle cx="40" cy="18" r="5" fill="#3a3d47"/><circle cx="58" cy="18" r="5" fill="#3a3d47"/>
  <text x="500" y="23" text-anchor="middle" class="mono d" font-size="12">zsh — 100×28</text>

  <g class="mono">
    <text x="28" y="70" class="ln" style="animation-delay:.2s"><tspan class="k">$</tspan><tspan class="v"> cat profile.json</tspan></text>
    <text x="28" y="102" class="ln d" style="animation-delay:.5s">{</text>
    <text x="28" y="126" class="ln" style="animation-delay:.7s"><tspan class="v">  "name"</tspan><tspan class="d">:      </tspan><tspan class="k">"María Paula Estupiñán"</tspan><tspan class="d">,</tspan></text>
    <text x="28" y="150" class="ln" style="animation-delay:.9s"><tspan class="v">  "role"</tspan><tspan class="d">:      </tspan><tspan class="k">"Software Developer &amp; DevRel"</tspan><tspan class="d">,</tspan></text>
    <text x="28" y="174" class="ln" style="animation-delay:1.1s"><tspan class="v">  "education"</tspan><tspan class="d">: </tspan><tspan class="k">"B.S. Systems Engineering — Universidad de los Andes"</tspan><tspan class="d">,</tspan></text>
    <text x="28" y="198" class="ln" style="animation-delay:1.3s"><tspan class="v">  "location"</tspan><tspan class="d">:  </tspan><tspan class="k">"Bogotá, CO"</tspan><tspan class="d">,</tspan></text>
    <text x="28" y="222" class="ln" style="animation-delay:1.5s"><tspan class="v">  "languages"</tspan><tspan class="d">: [</tspan><tspan class="k">"TypeScript"</tspan><tspan class="d">, </tspan><tspan class="k">"Rust"</tspan><tspan class="d">, </tspan><tspan class="k">"Python"</tspan><tspan class="d">, </tspan><tspan class="k">"Java"</tspan><tspan class="d">],</tspan></text>
    <text x="28" y="246" class="ln" style="animation-delay:1.7s"><tspan class="v">  "frontend"</tspan><tspan class="d">:  [</tspan><tspan class="k">"React"</tspan><tspan class="d">, </tspan><tspan class="k">"Next.js"</tspan><tspan class="d">, </tspan><tspan class="k">"Angular"</tspan><tspan class="d">],</tspan></text>
    <text x="28" y="270" class="ln" style="animation-delay:1.9s"><tspan class="v">  "web3"</tspan><tspan class="d">:      [</tspan><tspan class="k">"Stellar"</tspan><tspan class="d">, </tspan><tspan class="k">"Soroban"</tspan><tspan class="d">, </tspan><tspan class="k">"smart contracts"</tspan><tspan class="d">],</tspan></text>
    <text x="28" y="294" class="ln" style="animation-delay:2.1s"><tspan class="v">  "interests"</tspan><tspan class="d">: [</tspan><tspan class="k">"developer experience"</tspan><tspan class="d">, </tspan><tspan class="k">"technical writing"</tspan><tspan class="d">, </tspan><tspan class="k">"creative coding"</tspan><tspan class="d">]</tspan></text>
    <text x="28" y="318" class="ln d" style="animation-delay:2.3s">}</text>
    <text x="28" y="362" class="ln" style="animation-delay:2.6s"><tspan class="k">$</tspan><tspan class="cur k"> ▍</tspan></text>
  </g>
</svg>
